<!doctype html>

  <head>

    <meta name="theme-color" content="#0f0e16" />
    <script>
      // iOS home-screen webclips don't always match the
      // (display-mode: standalone) media query; mark the root element before
      // first paint so CSS can size the app shell with 100vh there.
      if (window.navigator.standalone === true) {
        document.documentElement.classList.add('standalone');
      }
      // Apply the stored theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem("bsplic.theme") === "light") {
          document.documentElement.classList.add("light");
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute("content", "#dc2626");
        }
      } catch (e) {
        /* storage unavailable — default dark theme stays */
      }
    </script>

    <!-- Boot splash: rendered before any JS/CSS loads so the PWA never shows
         a blank screen. src/lib/boot/boot-splash.ts drives its progress and
         removes it once the first screen is ready. The wordmark stays static
         at the exact screen center so the iOS startup image
         (public/splash, scripts/generate-ios-splash.mjs) hands off without a
         jump. -->
    <style id="boot-splash-style">
      #initial-splash {
        --boot-progress: 0.06;
        --boot-gold: hsl(46 98% 54%);
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: #0f0e16;
        color: #fff;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        transition:
          opacity 0.45s ease,
          visibility 0.45s ease;
      }
      #initial-splash.boot-splash-leaving {
        pointer-events: none;
      }
      #initial-splash.boot-splash-done {
        opacity: 0;
        visibility: hidden;
      }
      #initial-splash.boot-splash-reopen {
        animation: boot-fade 0.3s ease both;
      }
      .boot-glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at 50% 50%,
          hsl(355 100% 42% / 0.28),
          transparent 58%
        );
        animation: boot-fade 1s ease both;
      }
      .boot-wheel {
        --wheel: min(84vw, 330px);
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--wheel);
        height: var(--wheel);
        margin: calc(var(--wheel) / -2) 0 0 calc(var(--wheel) / -2);
        pointer-events: none;
        animation: boot-pop 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-wheel::before,
      .boot-wheel::after {
        content: "";
        position: absolute;
        border-radius: 50%;
      }
      .boot-wheel::before {
        inset: 0;
        border: 2px solid hsl(46 90% 58% / 0.8);
        box-shadow:
          0 0 42px hsl(355 100% 45% / 0.35),
          inset 0 0 22px hsl(46 90% 50% / 0.18);
      }
      .boot-wheel::after {
        inset: 31px;
        border: 1px solid hsl(46 90% 58% / 0.45);
      }
      .boot-wheel-ring {
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background:
          conic-gradient(from -4.865deg, #0f8a43 0 9.73deg, transparent 0),
          repeating-conic-gradient(
            from 4.865deg,
            #c1121f 0 9.73deg,
            #17141d 0 19.46deg
          );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 26px),
          #000 calc(100% - 25px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 26px),
          #000 calc(100% - 25px)
        );
        animation: boot-spin 7s linear infinite;
      }
      .boot-ball {
        position: absolute;
        inset: 0;
        animation: boot-spin-back 2.2s linear infinite;
      }
      .boot-ball::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 36px;
        width: 9px;
        height: 9px;
        margin-left: -4.5px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #fff,
          #c9c9d2 60%,
          #7c7c88
        );
        box-shadow: 0 0 10px hsl(0 0% 100% / 0.55);
      }
      .boot-wordmark {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 38px;
        font-weight: 900;
        font-style: italic;
        letter-spacing: -0.03em;
        line-height: 1;
        white-space: nowrap;
        /* At rest (position 100%) only the white tail is visible, so the
           first frame matches the startup image; the band sweeps across. */
        background: linear-gradient(
          110deg,
          #fff 30%,
          hsl(46 98% 64%) 41%,
          hsl(355 100% 62%) 47%,
          #fff 58%
        );
        background-size: 250% 100%;
        background-position: 100% 0;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: boot-shimmer 2.6s ease-in-out 0.6s infinite;
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #initial-splash.boot-splash-done .boot-wordmark {
        transform: translate(-50%, -50%) scale(1.08);
      }
      .boot-below {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% + min(42vw, 165px) + 22px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 0 24px;
        animation: boot-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
      }
      .boot-track {
        width: 156px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: hsl(0 0% 100% / 0.12);
      }
      .boot-bar {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, hsl(46 80% 45%), var(--boot-gold));
        transform-origin: left center;
        transform: scaleX(var(--boot-progress));
        transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .boot-status {
        margin: 0;
        min-height: 1.4em;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.01em;
        text-align: center;
        color: hsl(0 0% 100% / 0.62);
      }
      @keyframes boot-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes boot-pop {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes boot-shimmer {
        0% {
          background-position: 100% 0;
        }
        55%,
        100% {
          background-position: 0% 0;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-spin-back {
        to {
          transform: rotate(-360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-splash *,
        #initial-splash *::before,
        #initial-splash *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>

  <body>
    <div id="initial-splash" aria-hidden="true">
      <div class="boot-glow"></div>
      <div class="boot-wheel">
        <div class="boot-wheel-ring"></div>

        <div class="boot-track"><div class="boot-bar"></div></div>

      </div>
