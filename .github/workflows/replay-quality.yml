name: Replay quality

on:
  push:
    branches: [astra/bsplic-replay]
  pull_request:

permissions:
  contents: read

concurrency:
  group: replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Warsaw
      VITE_SUPABASE_URL: https://replay-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: replay-test-public-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Unit tests
        run: npm run test
      - name: Baseline lint (record existing issues)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run lint
      - name: Production build and bundle report
        if: ${{ !cancelled() }}
        run: npm run perf:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-build
          path: dist
          retention-days: 7
