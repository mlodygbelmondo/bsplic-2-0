name: Replay quality

on:
  push:
    branches: [astra/bsplic-replay]
  pull_request:

permissions:
  contents: read

concurrency:
  group: replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Warsaw
      VITE_SUPABASE_URL: https://replay-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: replay-test-public-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact source for isolated verification
        run: git archive HEAD | gzip > /tmp/replay-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: replay-source
          path: /tmp/replay-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Unit tests
        run: npm run test
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Replay and integration TypeScript check
        if: ${{ !cancelled() }}
        run: node scripts/check-replay-types.mjs
      - name: Production build and bundle report
        id: build
        if: ${{ !cancelled() }}
        run: npm run perf:build
      - name: Install browser engines
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium webkit
      - name: Production browser tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright test --config playwright.replay.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-browser-evidence
          path: |
            playwright-replay-report
            test-results/replay
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-build
          path: dist
          retention-days: 7
